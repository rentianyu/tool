name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-tool-xbta
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建（生成 catalog.json / index.html / version.js）
        run: python3 build.py

      - name: 语法与逻辑自检
        run: |
          for f in $(find site src -name '*.js'); do cp "$f" "/tmp/$(echo "$f" | tr '/.' '__').mjs"; node --check "/tmp/$(echo "$f" | tr '/.' '__').mjs"; done
          echo "语法检查通过"

      - name: 部署到 Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
