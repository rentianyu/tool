<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>哈希计算 · 工具箱</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/app.js"></script>
  <script type="module" src="/hash/app.js"></script>
</head>
<body class="page-tool" data-tool="hash">
  <main class="wrap">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">输入文本</span>
        <label class="btn btn-sm" for="file">选择文件计算</label>
        <input type="file" id="file" hidden>
      </div>
      <textarea id="input" spellcheck="false" placeholder="输入要计算哈希的文本，或选择文件"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn btn-primary" id="run" type="button">计算</button>
        <span class="mut small" id="src"></span>
        <span class="spacer"></span>
        <button class="btn btn-ghost" id="clear" type="button">清空</button>
      </div>
      <div class="msg" id="msg" style="margin-top:8px"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">结果（大写 / Base64 / 逐条复制）</span>
        <span class="row">
          <label class="row small mut"><input type="checkbox" id="upper"> 大写</label>
          <label class="row small mut"><input type="checkbox" id="b64"> Base64 输出</label>
        </span>
      </div>
      <table class="kv" id="tbl"></table>
    </div>
  </main>
</body>
</html>
