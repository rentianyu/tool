<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON 格式化 · 工具箱</title>
  <meta name="description" content="在线 JSON 格式化、压缩、校验，支持路径提取与错误定位，纯浏览器本地处理。">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/app.js"></script>
  <script type="module" src="/json/app.js"></script>
</head>
<body class="page-tool" data-tool="json">
  <main class="wrap">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">输入 JSON</span>
        <span class="row">
          <select id="indent" title="缩进">
            <option value="2">2 空格缩进</option>
            <option value="4">4 空格缩进</option>
            <option value="0">单行（紧凑）</option>
            <option value="tab">Tab 缩进</option>
          </select>
        </span>
      </div>
      <textarea id="input" spellcheck="false" placeholder='粘贴 JSON，例如 {"a":1,"b":[2,3]}'></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn btn-primary" id="fmt" type="button">格式化</button>
        <button class="btn" id="minify" type="button">压缩</button>
        <button class="btn" id="sort" type="button">键名排序</button>
        <button class="btn" id="escape" type="button">转义为字符串</button>
        <span class="spacer"></span>
        <button class="btn btn-ghost" id="clear" type="button">清空</button>
      </div>
      <div class="msg" id="msg" style="margin-top:8px"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">结果</span>
        <span class="row">
          <span class="mut small mono" id="stats"></span>
          <button class="btn btn-sm" id="copy" type="button">复制</button>
          <button class="btn btn-sm" id="download" type="button">下载</button>
        </span>
      </div>
      <pre class="out" id="output"></pre>
    </div>

    <div class="panel">
      <div class="panel-head"><span class="panel-title">路径提取</span></div>
      <div class="row">
        <input type="text" id="path" placeholder="如 data.items[0].name 或 data["key-with-dash"]" style="flex:1;min-width:240px">
        <button class="btn" id="pick" type="button">取值</button>
        <button class="btn btn-ghost" id="copyPick" type="button">复制结果</button>
      </div>
      <div class="out" id="pickOut" style="margin-top:8px;min-height:44px;max-height:220px"></div>
    </div>
  </main>
</body>
</html>
