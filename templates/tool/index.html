<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{NAME}} · 工具箱</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/app.js"></script>
  <script type="module" src="/{{SLUG}}/app.js"></script>
</head>
<body class="page-tool" data-tool="{{SLUG}}">
  <main class="wrap">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">输入</span>
      </div>
      <textarea id="input" spellcheck="false" placeholder="在这里输入"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn btn-primary" id="run" type="button">执行</button>
        <span class="spacer"></span>
        <button class="btn btn-ghost" id="clear" type="button">清空</button>
      </div>
      <div class="msg" id="msg" style="margin-top:8px"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">结果</span>
        <button class="btn btn-sm" id="copy" type="button">复制</button>
      </div>
      <pre class="out" id="output"></pre>
    </div>
  </main>
</body>
</html>
