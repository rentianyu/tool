<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工具箱 · tool.xbta.cc</title>
  <meta name="description" content="常用小工具合集：JSON 格式化、Base64、URL 编解码、时间戳、哈希、JWT、正则测试、文本对比等，纯浏览器本地处理。">
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/app.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body class="page-nav">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="/"><span class="logo-mark">⌘</span>工具箱</a>
      <div class="search">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M10.5 3a7.5 7.5 0 1 0 0 15 7.5 7.5 0 0 0 0-15Zm4.8 12.3L21 21"/></svg>
        <input id="q" type="search" placeholder="搜索工具 / 快捷键 / 用途…" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>
      <button class="icon-btn" id="theme" data-theme-toggle type="button" title="切换到夜间模式" aria-label="切换到夜间模式">☾</button>
    </div>
  </header>

  <nav class="catbar">
    <div class="catbar-inner">{{CATEGORY_NAV}}</div>
  </nav>

  <main class="wrap">
    <div class="nav-meta">
      <span>共 <b>{{TOOL_COUNT}}</b> 个工具 · <b>{{CATEGORY_COUNT}}</b> 个分类</span>
      <span class="dim">全部在浏览器本地运行，不上传数据</span>
    </div>

    <section class="group" id="recent-group" hidden>
      <h2>最近使用<span class="count" id="recent-count"></span></h2>
      <ul class="tools" id="recent-list"></ul>
    </section>

    <div id="tool-groups">
      {{TOOLS_HTML}}
    </div>

    <p class="empty" id="empty" hidden>没有匹配的工具，换个关键词试试。</p>
  </main>

  <footer class="footer">
    <span>tool.xbta.cc · v{{SITE_VERSION}} · 构建于 {{BUILD_TIME}}</span>
    <a href="https://github.com/rentianyu/tool" target="_blank" rel="noreferrer noopener">GitHub</a>
  </footer>
</body>
</html>
